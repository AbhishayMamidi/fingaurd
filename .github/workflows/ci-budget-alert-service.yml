name: CI — Budget Alert Service

on:
  push:
    paths:
      - 'budget-alert-service/**'
      - '.github/workflows/ci-budget-alert-service.yml'
  pull_request:
    paths:
      - 'budget-alert-service/**'
      - '.github/workflows/ci-budget-alert-service.yml'

defaults:
  run:
    working-directory: budget-alert-service

env:
  IMAGE_NAME: finguard-budget-alert-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Install, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: budget-alert-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --test tests/*.test.js

  build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./budget-alert-service
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
