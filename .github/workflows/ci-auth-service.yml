name: CI — Auth Service

on:
  push:
    paths:
      - 'auth-service/**'
      - '.github/workflows/ci-auth-service.yml'
  pull_request:
    paths:
      - 'auth-service/**'
      - '.github/workflows/ci-auth-service.yml'

defaults:
  run:
    working-directory: auth-service

env:
  IMAGE_NAME: finguard-auth-service
  # Short 7-char Git SHA used as immutable image tag
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Install, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      # auth-service has no ESLint config — skip lint step intentionally.
      # Add an eslint.config.js and run `npm run lint` here when lint is configured.

      - name: Run unit tests
        run: node --test tests/*.test.js

  build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — local CI)
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: false
          # Tag with both the full SHA and 'latest' for local use
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          # Export image to Docker daemon so Trivy can scan it
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
