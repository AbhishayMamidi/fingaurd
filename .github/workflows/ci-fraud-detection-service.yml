name: CI — Fraud Detection Service

on:
  push:
    paths:
      - 'fraud-detection-service/**'
      - '.github/workflows/ci-fraud-detection-service.yml'
  pull_request:
    paths:
      - 'fraud-detection-service/**'
      - '.github/workflows/ci-fraud-detection-service.yml'

defaults:
  run:
    working-directory: fraud-detection-service

env:
  IMAGE_NAME: finguard-fraud-detection-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Install, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fraud-detection-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ tests/ --max-line-length=120 --ignore=W503 --count --statistics
        continue-on-error: true

      - name: Run unit tests with pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./fraud-detection-service
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
