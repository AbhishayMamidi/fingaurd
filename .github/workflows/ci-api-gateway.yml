name: CI — API Gateway

on:
  push:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/ci-api-gateway.yml'
  pull_request:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/ci-api-gateway.yml'

env:
  IMAGE_NAME: finguard-api-gateway
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Validate Nginx Config & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate nginx.conf syntax (CI-isolated)
        # WHY THIS APPROACH:
        # The production nginx.conf uses upstream blocks with service-discovery hostnames
        # (e.g. auth-service:5001, transaction-service:5002). Nginx resolves these at
        # startup — not lazily. In a standalone CI container without Docker Compose or
        # Kubernetes networking, these names do not resolve, so `nginx -t` fails with:
        #   "host not found in upstream auth-service:5001"
        #
        # FIX: Create a CI-only copy of the config inside the container and use sed to
        # substitute upstream server hostnames with 127.0.0.1 before running nginx -t.
        # This validates syntax and configuration structure without requiring live backends.
        # The production nginx.conf is read-only and is never modified.
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/api-gateway/nginx.conf:/tmp/nginx.conf.prod:ro \
            nginx:alpine \
            sh -c "
              cp /tmp/nginx.conf.prod /tmp/nginx.conf.ci

              # Replace upstream server <hostname>:<port>; with 127.0.0.1:<port>;
              # Pattern anchored to lines starting with whitespace + 'server' + hostname char
              # so 'server {' (the server block directive) is left untouched.
              sed -i -E \
                's|(^[[:space:]]+server[[:space:]]+)[A-Za-z][A-Za-z0-9_-]*(:[0-9]+;)|\1127.0.0.1\2|' \
                /tmp/nginx.conf.ci

              echo '--- Upstream lines after substitution (must show 127.0.0.1) ---'
              grep -n 'server ' /tmp/nginx.conf.ci

              echo ''
              echo '--- Running nginx -t ---'
              nginx -c /tmp/nginx.conf.ci -t
            "

      - name: Verify production config still contains real service hostnames
        # Safety check: assert the production file was never modified.
        # If this fails, the previous step accidentally mutated the mounted volume.
        run: |
          echo "Checking production nginx.conf is unmodified..."
          grep -q 'auth-service:5001'          api-gateway/nginx.conf || (echo "FAIL: auth-service hostname missing" && exit 1)
          grep -q 'transaction-service:5002'   api-gateway/nginx.conf || (echo "FAIL: transaction-service hostname missing" && exit 1)
          grep -q 'categorization-service:5003' api-gateway/nginx.conf || (echo "FAIL: categorization-service hostname missing" && exit 1)
          grep -q 'fraud-detection-service:5004' api-gateway/nginx.conf || (echo "FAIL: fraud-detection-service hostname missing" && exit 1)
          grep -q 'budget-alert-service:5005'  api-gateway/nginx.conf || (echo "FAIL: budget-alert-service hostname missing" && exit 1)
          grep -q 'frontend:80'                api-gateway/nginx.conf || (echo "FAIL: frontend hostname missing" && exit 1)
          echo "OK: Production nginx.conf is intact."

  build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
