name: CI — API Gateway

on:
  push:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/ci-api-gateway.yml'
  pull_request:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/ci-api-gateway.yml'

env:
  IMAGE_NAME: finguard-api-gateway
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Validate Nginx Config & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate nginx.conf syntax
        # Spin up a stock nginx container, copy the config, and run nginx -t
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:alpine \
            nginx -t

  build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
