name: CI — Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

defaults:
  run:
    working-directory: frontend

env:
  IMAGE_NAME: finguard-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-lint:
    name: Install, Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vite build is the primary integration test — catches import errors, broken
      # module resolution, and missing env vars at build time.
      - name: Build (Vite production build)
        run: npm run build

      - name: Verify build artifact exists
        run: |
          if [ ! -d dist ]; then
            echo "ERROR: dist/ directory was not created by the build."
            exit 1
          fi
          echo "Build artifact verified."
          ls -lh dist/assets/

  docker-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build Docker image (multi-stage: Vite build + Nginx serve)"
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
