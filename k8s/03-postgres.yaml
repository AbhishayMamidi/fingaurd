apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: finguard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: finguard-platform
data:
  01-init-databases.sh: |
    #!/bin/sh
    set -e
    create_db() {
        local db=$1
        echo "Checking and creating database '$db' if not exists..."
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" <<-EOSQL
            SELECT 'CREATE DATABASE $db'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
            GRANT ALL PRIVILEGES ON DATABASE $db TO $POSTGRES_USER;
    EOSQL
    }
    create_db "${POSTGRES_AUTH_DB:-finguard_auth}"
    create_db "${POSTGRES_TRANSACTIONS_DB:-finguard_transactions}"
    create_db "${POSTGRES_BUDGETS_DB:-finguard_budgets}"
    echo "FinGuard PostgreSQL databases successfully initialized."
  02-init-databases.sql: |
    SELECT 'CREATE DATABASE finguard_auth' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'finguard_auth')\gexec
    SELECT 'CREATE DATABASE finguard_transactions' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'finguard_transactions')\gexec
    SELECT 'CREATE DATABASE finguard_budgets' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'finguard_budgets')\gexec
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: finguard
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: finguard-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: finguard
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: finguard-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: finguard-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finguard-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finguard-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: finguard
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: finguard-platform
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
