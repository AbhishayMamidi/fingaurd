apiVersion: v1
kind: Service
metadata:
  name: auth-service-stable
  namespace: finguard
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: finguard-platform
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: 5001
      name: http
  selector:
    app: auth-service
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-canary
  namespace: finguard
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: finguard-platform
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: 5001
      name: http
  selector:
    app: auth-service
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: auth-service-success-rate
  namespace: finguard
spec:
  metrics:
    - name: success-rate
      interval: 10s
      count: 2
      successCondition: len(result) == 0 || result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{app="auth-service",status_code!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{app="auth-service"}[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-service
  namespace: finguard
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: finguard-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: auth-service
          image: finguard-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: finguard-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finguard-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finguard-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finguard-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 200Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
  strategy:
    canary:
      stableService: auth-service-stable
      canaryService: auth-service-canary
      steps:
        # Step 1: 10% canary traffic
        - setWeight: 10
        - pause:
            duration: 15s
        # Step 2: 30% canary traffic
        - setWeight: 30
        - pause:
            duration: 15s
        # Step 3: 60% canary traffic
        - setWeight: 60
        - pause:
            duration: 15s
        # Step 4: 100% full promotion
        - setWeight: 100
      analysis:
        templates:
          - templateName: auth-service-success-rate
        startingStep: 1
  minReadySeconds: 5
