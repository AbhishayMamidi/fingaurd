# ArgoCD Application — FinGuard (finguard namespace)
#
# This declares the finguard application to ArgoCD in GitOps fashion.
# ArgoCD will watch the k8s/ directory of the configured repository and
# apply any changes automatically (or on manual sync in manual mode).
#
# HOW TO APPLY (after ArgoCD is installed):
#   kubectl apply -f k8s/argocd/finguard-app.yaml
#
# ArgoCD will then manage:
#   - All manifests matched by k8s/kustomization.yaml
#   - Namespace: finguard
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finguard
  namespace: argocd
  # Cascade delete: when this Application is deleted, ArgoCD will also
  # delete all child Kubernetes resources it manages.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: finguard
spec:
  project: default

  source:
    # ─── REQUIRED: replace with your actual GitHub repository URL ───────────
    repoURL: https://github.com/AbhishayMamidi/fingaurd.git
    # ────────────────────────────────────────────────────────────────────────
    targetRevision: HEAD
    path: k8s
    kustomize:
      # No image overrides yet — using local images loaded into Minikube.
      # When a CI/CD registry is configured, add image overrides here:
      # images:
      #   - finguard-auth-service=ghcr.io/YOUR_GITHUB_USERNAME/finguard-auth-service:GITSHA
      {}

  destination:
    server: https://kubernetes.default.svc
    namespace: finguard

  syncPolicy:
    # automated: Uncomment to enable fully automatic sync on every Git push.
    # For a beginner setup, start with manual sync so you can review changes first.
    # automated:
    #   prune: true      # Delete k8s resources that no longer exist in Git
    #   selfHeal: true   # Re-apply if someone manually changes a resource

    syncOptions:
      # Create the namespace if it doesn't already exist
      - CreateNamespace=true
      # Apply server-side apply for better CRD and large-manifest handling
      - ServerSideApply=true

  # Health checks: ArgoCD evaluates these resources' health before marking sync Healthy
  ignoreDifferences:
    # Kubernetes mutates some fields (e.g., default tolerations) — ignore them
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
